
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Therapist Exam Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#243047}
header{background:#5546a5;color:white;padding:22px 16px;text-align:center}
header h1{margin:0 0 8px;font-size:25px}
main{max-width:760px;margin:20px auto;padding:0 14px}
.panel{background:white;padding:20px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 14px #17255412}
select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #d4d8e5}
select{width:100%;margin:7px 0 14px;background:white}
button{cursor:pointer;background:#5546a5;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1}
.option{display:block;width:100%;text-align:left;margin:9px 0;background:#f5f5fc;color:#243047;border:2px solid #e1e2ef}
.option:hover:not(:disabled){border-color:#8879df}
.option.correct{background:#e0f8e9;border-color:#36a567}
.option.wrong{background:#ffe7e7;border-color:#e76a6a}
#feedback{padding:13px;border-radius:10px;margin-top:12px;line-height:1.5}
#feedback:empty{display:none}
.meter{height:9px;background:#e6e6f2;border-radius:20px;overflow:hidden;margin:12px 0}
#bar{height:100%;width:0;background:#6755c8;transition:width .2s}
.cats{display:flex;justify-content:center;gap:24px;font-size:42px;margin:10px}
.cat{display:inline-block}
.treat{animation:happy .6s ease}
.bonk{animation:bonk .6s ease}
@keyframes happy{50%{transform:translateY(-14px) rotate(10deg)}}
@keyframes bonk{25%{transform:rotate(-20deg) translateX(-5px)}50%{transform:rotate(20deg) translateX(5px)}}
.small{font-size:14px;color:#626b80}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>🐱 Speech Therapist Exam Practice</h1>
<p>Learn • Practise • Improve</p>
</header>
<main>
<section class="panel" id="setup">
<h2>Set up your practice</h2>
<label for="difficulty">Difficulty</label>
<select id="difficulty">
<option value="Easy">Easy</option>
<option value="Moderate">Moderate</option>
<option value="Hard">Hard</option>
<option value="All">All difficulties</option>
</select>
<label for="topic">Topic</label>
<select id="topic"><option value="All">All topics</option></select>
<label for="count">Questions in this session</label>
<select id="count">
<option>10</option><option>20</option><option>30</option>
<option>50</option><option>100</option>
</select>
<div class="actions">
<button id="start">Start practice</button>
<button id="review">Review mistakes</button>
</div>
<p class="small">Progress and mistakes are saved in this browser.</p>
</section>

<section class="panel">
<h3>Your learning progress</h3>
<p id="stats">Loading progress…</p>
</section>

<section class="panel hidden" id="quiz">
<div class="small" id="position"></div>
<div class="meter"><div id="bar"></div></div>
<p class="small" id="meta"></p>
<h2 id="question"></h2>
<div id="options"></div>
<div id="feedback" aria-live="polite"></div>
<div class="cats">
<span id="owner" class="cat" title="The cat owner">🐱</span>
<span id="student" class="cat" title="The student cat">😺</span>
</div>
<p id="catMessage" class="small" style="text-align:center">Choose your best answer!</p>
<button id="next" class="hidden">Next question →</button>
</section>

<section class="panel hidden" id="results">
<h2>Session complete! 🎉</h2>
<p id="summary"></p>
<div class="actions">
<button id="again">Practise again</button>
<button id="home">Back to setup</button>
</div>
</section>
</main>

<script src="questions.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const BANK = window.QUESTION_BANK || [];
let session = [], index = 0, score = 0, mistakes = [], answered = false;
const read = () => {
 try { return JSON.parse(localStorage.getItem('speechPracticeProgress') || '{"answered":0,"correct":0,"mistakes":[]}'); }
 catch { return {answered:0,correct:0,mistakes:[]}; }
};
const save = data => localStorage.setItem('speechPracticeProgress', JSON.stringify(data));
function updateStats() {
 const p = read();
 $('stats').textContent = `Answered: ${p.answered} · Correct: ${p.correct} · Accuracy: ${p.answered ? Math.round(p.correct/p.answered*100) : 0}%`;
}
function shuffle(arr) {
 for(let i=arr.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}
function initTopics() {
 [...new Set(BANK.map(q=>q.topic))].sort().forEach(topic=>{
  const opt=document.createElement('option'); opt.value=topic; opt.textContent=topic;
  $('topic').appendChild(opt);
 });
}
function start(reviewOnly=false) {
 const p=read();
 let pool=BANK.filter(q=>
  ($('difficulty').value==='All'||q.difficulty===$('difficulty').value) &&
  ($('topic').value==='All'||q.topic===$('topic').value)
 );
 if(reviewOnly) pool=pool.filter(q=>p.mistakes.includes(q.id));
 if(!pool.length){alert(reviewOnly?'No saved mistakes to review yet.':'No questions match those settings.');return;}
 session=shuffle([...pool]).slice(0,reviewOnly?pool.length:Number($('count').value));
 index=0;score=0;mistakes=[]; $('setup').classList.add('hidden');
 $('results').classList.add('hidden');$('quiz').classList.remove('hidden');
 showQuestion();
}
function showQuestion() {
 answered=false;
 const q=session[index];
 $('position').textContent=`Question ${index+1} of ${session.length}`;
 $('bar').style.width=`${index/session.length*100}%`;
 $('meta').textContent=`${q.topic} · ${q.difficulty}`;
 $('question').textContent=q.question;
 $('options').replaceChildren();
 $('feedback').textContent='';
 $('next').classList.add('hidden');
 $('owner').className='cat';$('student').className='cat';
 $('catMessage').textContent='Choose your best answer!';
 const options=shuffle(q.options.map((text,i)=>({text,correct:i===q.answer})));
 options.forEach((item,i)=>{
  const b=document.createElement('button');
  b.className='option';b.textContent=`${String.fromCharCode(65+i)}. ${item.text}`;
  b.onclick=()=>answer(b,item.correct,q);
  $('options').appendChild(b);
 });
}
function answer(button,correct,q) {
 if(answered)return; answered=true;
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 const p=read();p.answered++;
 if(correct){score++;p.correct++;button.classList.add('correct');
  $('owner').classList.add('treat');$('student').classList.add('treat');
  $('catMessage').textContent='😻 Correct! The owner gives the student cat a treat!';
  $('feedback').style.background='#e0f8e9';
  $('feedback').textContent='Correct! '+q.explanation;
  p.mistakes=p.mistakes.filter(id=>id!==q.id);
 } else {
  button.classList.add('wrong');mistakes.push(q.id);
  p.mistakes=[...new Set([...p.mistakes,q.id])];
  $('owner').classList.add('bonk');$('student').classList.add('bonk');
  $('catMessage').textContent='🙀 Bonk! Just cartoon comedy. Learn and try again!';
  $('feedback').style.background='#fff0f0';
  $('feedback').textContent='Not quite. Best answer: '+q.options[q.answer]+'. '+q.explanation;
  // Highlight the correct option.
  document.querySelectorAll('.option').forEach(b=>{
   if(b.textContent.slice(3)===q.options[q.answer]) b.classList.add('correct');
  });
 }
 save(p);updateStats();
 $('bar').style.width=`${(index+1)/session.length*100}%`;
 $('next').textContent=index===session.length-1?'See results':'Next question →';
 $('next').classList.remove('hidden');
}
function finish() {
 $('quiz').classList.add('hidden');$('results').classList.remove('hidden');
 $('summary').textContent=`You scored ${score} out of ${session.length} (${Math.round(score/session.length*100)}%). Review mistakes to strengthen your knowledge.`;
}
$('start').onclick=()=>start(false);
$('review').onclick=()=>start(true);
$('next').onclick=()=>{if(index<session.length-1){index++;showQuestion();}else finish();};
$('again').onclick=()=>start(false);
$('home').onclick=()=>{$('results').classList.add('hidden');$('setup').classList.remove('hidden');};
initTopics();updateStats();
})();
</script>
</body>
</html>
